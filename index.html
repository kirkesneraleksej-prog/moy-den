<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Мой день</title>
<meta name="description" content="Планировщик дня, тренировок и питания">
<meta name="theme-color" content="#4f46e5">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Мой день">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
:root{
  --bg:#f4f4f7; --card:#fff; --text:#16161d; --muted:#6b6b7b; --line:#e6e6ee; --soft:#f0f0f5;
  --day:#4f46e5; --day-s:#eceafd;
  --train:#ea580c; --train-s:#fdeee4;
  --food:#16a34a; --food-s:#e5f6eb;
  --stat:#0891b2; --stat-s:#e1f3f7;
  --water:#2563eb; --danger:#dc2626;
  --r:16px; --shadow:0 1px 2px rgba(0,0,0,.04),0 4px 14px rgba(0,0,0,.04);
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0f0f14; --card:#1a1a22; --text:#ececf2; --muted:#9a9aab; --line:#2a2a35; --soft:#22222c;
    --day:#8b83ff; --day-s:#24223f;
    --train:#fb8a4a; --train-s:#3a2418;
    --food:#4ade80; --food-s:#173022;
    --stat:#22c3e6; --stat-s:#132e36;
    --water:#60a5fa; --danger:#f87171;
    --shadow:none;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  padding-bottom:calc(76px + env(safe-area-inset-bottom))}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
input,select,textarea{background:var(--soft);border:1px solid transparent;border-radius:10px;padding:10px 12px;width:100%;outline:none}
input:focus,textarea:focus,select:focus{border-color:var(--acc,var(--day));background:var(--card)}
input[type=checkbox]{width:auto}
.wrap{max-width:640px;margin:0 auto;padding:0 16px}
.top{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(10px + env(safe-area-inset-top)) 0 8px}
.top .wrap{display:flex;align-items:center;gap:10px;min-height:40px}
.top h1{font-size:22px;margin:0;flex:1;letter-spacing:-.01em}
.iconbtn{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--card);box-shadow:var(--shadow);font-size:18px}
.card{background:var(--card);border-radius:var(--r);padding:14px;box-shadow:var(--shadow);margin-bottom:12px}
.card h3{margin:0 0 10px;font-size:15px;display:flex;align-items:center;gap:8px}
.muted{color:var(--muted)}
.small{font-size:13px}
.row{display:flex;gap:8px;align-items:center}
.grow{flex:1;min-width:0}
.btn{background:var(--acc,var(--day));color:#fff;border-radius:12px;padding:10px 14px;font-weight:600;white-space:nowrap}
.btn.ghost{background:var(--soft);color:var(--text)}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:10px}
.btn:disabled{opacity:.4}
.link{color:var(--acc,var(--day));font-weight:600;font-size:13px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--soft);border-radius:999px;padding:7px 12px;font-size:14px;display:inline-flex;align-items:center;gap:6px}
.chip.on{background:var(--acc,var(--day));color:#fff}
.chip .x{opacity:.6;font-size:12px}
.chip.prev{outline:1.5px dashed var(--acc,var(--day));outline-offset:-1.5px}
.bar{height:8px;border-radius:99px;background:var(--soft);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--acc,var(--day));border-radius:99px;transition:width .3s}
.bar.over>i{background:var(--danger)}
.empty{text-align:center;padding:18px 8px;color:var(--muted)}
.empty .big{font-size:34px;margin-bottom:4px}

/* home */
.hello{padding:4px 0 14px}
.hello h2{margin:0;font-size:26px;letter-spacing:-.02em}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.tile{background:var(--card);border-radius:20px;padding:14px;box-shadow:var(--shadow);text-align:left;display:flex;flex-direction:column;gap:6px;min-height:132px;position:relative;overflow:hidden}
.tile .ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:21px;background:var(--s);}
.tile b{font-size:16px}
.tile .v{font-size:13px;color:var(--muted);margin-top:auto}
.tile .bar{margin-top:4px}
.focus{background:linear-gradient(135deg,var(--day),#7c3aed);color:#fff;border-radius:20px;padding:16px;margin-bottom:12px}
.focus .small{opacity:.85}
.focus b{font-size:18px;display:block;margin-top:2px}

/* date bar */
.datebar{display:flex;align-items:center;gap:6px;margin-bottom:12px}
.datebar .lbl{flex:1;text-align:center;font-weight:700;background:var(--card);border-radius:12px;padding:9px 6px;box-shadow:var(--shadow)}
.datebar .lbl small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.datebar .iconbtn{flex:none}

/* tasks */
.task{display:flex;align-items:center;gap:10px;padding:10px 2px;border-bottom:1px solid var(--line)}
.task:last-child{border-bottom:0}
.task .t{flex:1;min-width:0;word-wrap:break-word}
.task.done .t{text-decoration:line-through;color:var(--muted)}
.task .time{font-variant-numeric:tabular-nums;font-size:13px;color:var(--acc);font-weight:600;min-width:40px}
.check{width:26px;height:26px;border-radius:8px;border:2px solid var(--line);flex:none;display:grid;place-items:center;color:#fff;font-size:15px}
.check.on{background:var(--acc,var(--day));border-color:var(--acc,var(--day))}
.del{color:var(--muted);font-size:16px;padding:4px 6px}
.rep{font-size:15px;padding:4px;opacity:.25}
.rep.on{opacity:1}
.moods{display:flex;justify-content:space-between}
.moods button{font-size:28px;padding:6px;border-radius:12px;opacity:.35;transition:.15s}
.moods button.on{opacity:1;background:var(--soft);transform:scale(1.1)}

/* перетаскивание и правка */
.task{user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;cursor:pointer}
.dragging .task{transition:transform .15s}
.dragging .task.drag{transition:none;position:relative;z-index:6;background:var(--card);box-shadow:0 8px 24px rgba(0,0,0,.22);border-radius:12px;padding-left:8px;padding-right:8px}
.dragging{touch-action:none}
/* workout */
.ex{border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px}
.ex .name{font-weight:700}
.badge{display:inline-block;font-size:12px;padding:2px 8px;border-radius:99px;background:var(--train-s);color:var(--train);font-weight:600}
.sets{width:100%;border-collapse:collapse;margin-top:8px}
.sets td,.sets th{padding:3px 3px;text-align:center}
.sets th{font-size:12px;color:var(--muted);font-weight:500}
.sets input{text-align:center;padding:8px 4px}
.sets td:first-child{color:var(--muted);width:26px;font-size:13px}
.sets td:last-child{width:40px}
.prevline{font-size:12.5px;color:var(--muted);margin-top:3px}
.timer{position:fixed;right:16px;bottom:calc(86px + env(safe-area-inset-bottom));z-index:9;background:var(--train);color:#fff;border-radius:999px;padding:12px 16px;font-weight:700;box-shadow:0 6px 20px rgba(0,0,0,.25);font-variant-numeric:tabular-nums;display:flex;gap:10px;align-items:center}
.timer.idle{padding:12px 14px}
.sum3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.sum3 b{display:block;font-size:20px}

/* карточки с картинками */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:8px}
.cards.sm{grid-template-columns:repeat(4,1fr);gap:6px}
.cards.sm .pic{font-size:26px}
.cards.sm .cap{font-size:12px;padding:5px 2px 6px}
.pcard{background:var(--soft);border-radius:14px;overflow:hidden;text-align:center;font-size:12.5px;line-height:1.2;display:flex;flex-direction:column;border:2px solid transparent}
.pcard.on{border-color:var(--acc)}
.pcard .cap{padding:6px 4px 8px;font-weight:600}
.pcard .cap small{display:block;font-weight:400;color:var(--muted);font-size:11px;margin-top:2px}
.pic{position:relative;display:grid;place-items:center;aspect-ratio:1;background:var(--s);font-size:34px;overflow:hidden}
.pic img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.thumb{width:46px;flex:none;border-radius:10px;overflow:hidden}
.thumb .pic{font-size:22px}
/* food */
.ring{position:relative;width:110px;height:110px;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring .c{position:absolute;inset:0;display:grid;place-items:center;text-align:center;line-height:1.1}
.ring .c b{font-size:22px}
.macro{display:grid;grid-template-columns:22px 1fr auto;gap:8px;align-items:center;font-size:13px;margin:6px 0}
.food{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.food:last-child{border-bottom:0}
.food.done .t{color:var(--muted)}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.grid4 label,.lab{font-size:11px;color:var(--muted);display:block;margin:6px 0 2px}
.water{display:flex;gap:4px;flex-wrap:wrap}
.water button{font-size:24px;opacity:.25;padding:2px}
.water button.on{opacity:1}
.mealhead{display:flex;align-items:center;justify-content:space-between;margin:4px 0}
.mealhead b{font-size:15px}

/* stats */
.bars{display:flex;align-items:flex-end;gap:6px;height:110px;margin-top:8px}
.bars div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px}
.bars i{display:block;width:100%;border-radius:6px 6px 3px 3px;background:var(--acc);min-height:3px}
.bars span{font-size:11px;color:var(--muted)}
.big3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}
.big3 .card{margin:0;text-align:center;padding:12px 6px}
.big3 b{font-size:24px;display:block}

/* calendar */
.calhead{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.calhead b{flex:1;text-align:center;font-size:17px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .wd{font-size:11px;color:var(--muted);text-align:center;padding-bottom:2px}
.cal button{aspect-ratio:1;border-radius:12px;background:var(--soft);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:14px;font-variant-numeric:tabular-nums}
.cal button.today{outline:2px solid var(--acc);outline-offset:-2px}
.cal button.sel{background:var(--acc);color:#fff}
.cal .dots{display:flex;gap:2px;height:6px}
.cal .dots i{width:6px;height:6px;border-radius:50%}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:10px}
.legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px}
.prog{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.prog:last-child{border-bottom:0}
.delta{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.up{color:var(--food)} .down{color:var(--danger)}
/* nav */
nav{position:fixed;left:0;right:0;bottom:0;z-index:8;background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav .wrap{display:flex;justify-content:space-around;padding:0 4px}
nav a{flex:1;text-align:center;text-decoration:none;color:var(--muted);font-size:10.5px;padding:8px 0 9px;display:flex;flex-direction:column;align-items:center;gap:1px}
nav a .e{font-size:21px;filter:grayscale(1);opacity:.6}
nav a.on{color:var(--text);font-weight:600}
nav a.on .e{filter:none;opacity:1}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);width:100%;max-width:640px;border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom))}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom));background:#16161d;color:#fff;padding:10px 16px;border-radius:12px;z-index:30;font-size:14px;max-width:90vw;text-align:center}
.sec-day{--acc:var(--day);--s:var(--day-s)}
.sec-train{--acc:var(--train);--s:var(--train-s)}
.sec-food{--acc:var(--food);--s:var(--food-s)}
.sec-stat{--acc:var(--stat);--s:var(--stat-s)}
.sec-set{--acc:var(--day);--s:var(--day-s)}
</style>
</head>
<body>
<header class="top"><div class="wrap" id="top"></div></header>
<main class="wrap" id="app"></main>
<nav><div class="wrap" id="nav"></div></nav>
<div id="timer"></div>
<div id="overlay"></div>

<script>
'use strict';
/* ---------- данные ---------- */
const KEY = 'moy-den.v1';
const GROUPS = ['Руки','Пресс','Грудь','Спина','Ноги','Плечи','Ягодицы','Кардио'];
// картинки лежат в img/gr/<файл>.jpg и img/ex/<файл>.jpg; если файла нет — показывается эмодзи
const GROUP_IMG = {'Руки':['ruki','💪'],'Пресс':['press','🔥'],'Грудь':['grud','🛡️'],'Спина':['spina','🦅'],'Ноги':['nogi','🦵'],'Плечи':['plechi','🏔️'],'Ягодицы':['yagodicy','🍑'],'Кардио':['kardio','🏃']};
const CATALOG = [
  ['Руки','Бицепс со штангой','Штанга','biceps-shtanga'],['Руки','Бицепс в кроссовере','Кроссовер','biceps-krossover'],
  ['Руки','Молотки с гантелями','Гантели','molotki'],['Руки','Трицепс в кроссовере','Кроссовер','triceps-krossover'],
  ['Руки','Французский жим','Штанга','francuzskiy-zhim'],['Руки','Отжимания на брусьях','Брусья','brusya'],
  ['Руки','Предплечья со штангой','Штанга','predplechya'],
  ['Пресс','Скручивания в тренажёре','Тренажёр','press-trenazher'],['Пресс','Подъём ног в висе','Турник','podem-nog'],
  ['Пресс','Скручивания на полу','Свой вес','skruchivaniya'],['Пресс','Планка','Свой вес','planka'],
  ['Грудь','Жим в хаммере','Хаммер','zhim-hammer'],['Грудь','Жим штанги лёжа','Штанга','zhim-lezha'],
  ['Грудь','Жим гантелей на наклонной','Гантели','zhim-naklon'],['Грудь','Сведение в кроссовере','Кроссовер','svedenie-krossover'],
  ['Грудь','Бабочка','Тренажёр','babochka'],
  ['Спина','Подтягивания','Турник','podtyagivaniya'],['Спина','Тяга верхнего блока','Тренажёр','tyaga-verh'],
  ['Спина','Тяга горизонтального блока','Тренажёр','tyaga-gorizont'],['Спина','Тяга штанги в наклоне','Штанга','tyaga-naklon'],
  ['Спина','Тяга в хаммере','Хаммер','tyaga-hammer'],['Спина','Гиперэкстензия','Тренажёр','giperekstenziya'],
  ['Ноги','Приседания со штангой','Штанга','prisedaniya'],['Ноги','Жим ногами','Тренажёр','zhim-nogami'],
  ['Ноги','Разгибание ног','Тренажёр','razgibanie-nog'],['Ноги','Сгибание ног','Тренажёр','sgibanie-nog'],
  ['Ноги','Выпады с гантелями','Гантели','vypady'],['Ноги','Подъём на носки','Тренажёр','noski'],
  ['Плечи','Жим гантелей сидя','Гантели','zhim-sidya'],['Плечи','Махи в стороны','Гантели','mahi'],
  ['Плечи','Тяга к подбородку','Штанга','tyaga-podborodok'],['Плечи','Обратная бабочка','Тренажёр','obr-babochka'],
  ['Ягодицы','Ягодичный мост','Штанга','yagod-most'],['Ягодицы','Отведение ноги в кроссовере','Кроссовер','otvedenie'],
  ['Кардио','Беговая дорожка','Тренажёр','dorozhka'],['Кардио','Велотренажёр','Тренажёр','velo'],['Кардио','Эллипс','Тренажёр','ellips'],
].map(([group,name,equip,img]) => ({group,name,equip,img}));
const catFind = name => CATALOG.find(c => c.name.toLowerCase() === name.toLowerCase());
function pic(dir, file, emoji){
  return `<span class="pic"><img src="img/${dir}/${file}.jpg" alt="" loading="lazy" onerror="this.remove()"><span>${emoji}</span></span>`;
}
const EQUIP = ['Штанга','Гантели','Кроссовер','Тренажёр','Хаммер','Смит','Турник','Брусья','Свой вес'];
const MEALS = [['b','Завтрак','🍳'],['l','Обед','🍲'],['d','Ужин','🍽'],['s','Перекус','🍎']];
const MOODS = ['😩','😕','😐','🙂','🤩'];

function fresh(){
  return {days:{}, taskLib:{}, workouts:{}, exLib:{}, meals:{}, foodLib:{},
    settings:{name:'', waterL:2, glass:250, rest:90, autoRest:true}};
}
function load(){
  try { const d = JSON.parse(localStorage.getItem(KEY)); if (d) {
    const base = fresh(), st = Object.assign(base.settings, d.settings||{});
    delete st.water; delete st.goals;
    Object.values(d.days||{}).forEach(x => { if (x.waterMl == null) x.waterMl = (x.water||0)*250; delete x.water; });
    const lib = {}; Object.entries(d.foodLib||{}).forEach(([k,v]) => { if (v.count>0) lib[k] = {name:v.name, count:v.count}; });
    Object.values(d.meals||{}).forEach(m => m.items.forEach(i => { if (i.g && i.g!==100 && !/ г$/.test(i.name)) i.name = `${i.name} ${i.g} г`; delete i.k; delete i.b; delete i.j; delete i.u; delete i.g; }));
    return Object.assign(base, d, {settings:st, foodLib:lib});
  } } catch(e){}
  return fresh();
}
let S = load();
function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){ toast('Не удалось сохранить'); } }

/* ---------- утилиты ---------- */
const $ = s => document.querySelector(s);
const uid = () => Math.random().toString(36).slice(2,9);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num = v => { const n = parseFloat(String(v).replace(',','.')); return isFinite(n) ? n : 0; };
const r0 = n => Math.round(n);
const ds = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const today = () => ds(new Date());
const addDays = (s,n) => { const d = new Date(s+'T12:00'); d.setDate(d.getDate()+n); return ds(d); };
const WD = ['вс','пн','вт','ср','чт','пт','сб'];
const MON = ['янв','фев','мар','апр','мая','июн','июл','авг','сен','окт','ноя','дек'];
function fmt(s){ const d = new Date(s+'T12:00'); return `${WD[d.getDay()]}, ${d.getDate()} ${MON[d.getMonth()]}`; }
function rel(s){ const t = today(); return s===t ? 'Сегодня' : s===addDays(t,1) ? 'Завтра' : s===addDays(t,-1) ? 'Вчера' : s===addDays(t,2) ? 'Послезавтра' : fmt(s); }
function plural(n, a, b, c){ n = Math.abs(n)%100; const m = n%10; return n>10&&n<20 ? c : m===1 ? a : m>=2&&m<=4 ? b : c; }
let toastT;
function toast(msg){ const o = $('#overlay'); clearTimeout(toastT);
  const t = document.createElement('div'); t.className='toast'; t.textContent=msg; document.body.appendChild(t);
  toastT = setTimeout(()=>t.remove(), 2200); }

/* ---------- состояние экрана ---------- */
const V = {day:today(), train:today(), food:today(), newGroups:[], newEquip:'', foodMeal:null, editLib:false, statEx:'', focus:null, edit:null, cal:today().slice(0,7), calDay:today()};

/* ---------- день ---------- */
function getDay(date, create){
  if (S.days[date]) return S.days[date];
  const d = {tasks:[], waterMl:0, mood:null};
  if (date >= today()) {
    Object.values(S.taskLib).filter(x=>x.daily).forEach(x => d.tasks.push({id:uid(), text:x.text, time:x.time||'', done:false}));
    d.tasks = sortedTasks(d.tasks);
  }
  if (create || d.tasks.length) { S.days[date] = d; save(); }
  return d;
}
function libTouch(text, date, time){
  const k = text.toLowerCase(); const e = S.taskLib[k] || {text, count:0, daily:false};
  e.count++; e.last = date; if (time) e.time = time; S.taskLib[k] = e;
}
function prevDayWithTasks(date){
  return Object.keys(S.days).filter(k => k < date && S.days[k].tasks.length).sort().pop();
}
function sortedTasks(tasks){
  return tasks.slice().sort((a,b) => (a.time||'99') < (b.time||'99') ? -1 : (a.time||'99') > (b.time||'99') ? 1 : 0);
}

/* ---------- тренировки ---------- */
function lastSession(name, before){
  const n = name.toLowerCase();
  const dates = Object.keys(S.workouts).filter(d => d < before).sort().reverse();
  for (const d of dates) {
    const ex = S.workouts[d].exercises.find(e => e.name.toLowerCase() === n && e.sets.some(s => s.w!=='' || s.r!==''));
    if (ex) return {date:d, ex};
  }
  return null;
}
function newExercise(name, equip, before){
  const last = lastSession(name, before);
  const sets = last ? last.ex.sets.map(()=>({w:'', r:'', done:false})) : [1,2,3].map(()=>({w:'', r:'', done:false}));
  const c = catFind(name);
  return {id:uid(), name, equip, sets, img:c?c.img:'', group:c?c.group:''};
}
function placeholder(ex, i, before, field){
  const last = lastSession(ex.name, before); if (!last) return field==='w' ? 'кг' : 'раз';
  const s = last.ex.sets[i] || last.ex.sets[last.ex.sets.length-1];
  return s && s[field] !== '' ? s[field] : (field==='w' ? 'кг' : 'раз');
}
function setsStr(sets){
  return sets.filter(s=>s.w!==''||s.r!=='').map(s => (s.w!==''? s.w : '—') + '×' + (s.r!==''? s.r : '—')).join(', ');
}
function tonnage(w){ return w.exercises.reduce((a,e)=>a+e.sets.reduce((b,s)=>b+(s.done? num(s.w)*num(s.r):0),0),0); }

/* ---------- еда ---------- */
function getMeals(date, create){
  if (!S.meals[date] && create) S.meals[date] = {items:[]};
  return S.meals[date] || {items:[]};
}

function waterRow(date){
  const ml = getDay(date).waterMl||0, gl = S.settings.glass, goal = S.settings.waterL*1000;
  const n = Math.max(Math.ceil(goal/gl), Math.ceil(ml/gl)), have = Math.floor(ml/gl + 0.001);
  let s = '<div class="water">';
  for (let i=1;i<=n;i++) s += `<button class="${i<=have?'on':''}" data-act="water" data-d="${date}" data-i="${i}" aria-label="${fmtL(i*gl)} л">🥛</button>`;
  return s + `</div><div class="muted small" style="margin-top:6px">1 стакан = ${gl} мл</div>`;
}

    ${w.done ? `<button class="btn ghost grow" data-act="wdone">Отметить как незаконченную</button>`

/* --- питание --- */

  let html = datebar('food');
  const prev = Object.keys(S.meals).filter(k=>k<date && S.meals[k].items.length).sort().pop();
  if (!n && prev) html += `<button class="btn" style="width:100%;margin-bottom:12px" data-act="fcopy" data-d="${prev}">↺ Меню как ${prev===addDays(date,-1)?'вчера':fmt(prev)} (${S.meals[prev].items.length} поз.)</button>`;

  MEALS.forEach(([code, title, em]) => {
    const items = m.items.filter(i=>i.meal===code);
    html += `<div class="card"><div class="mealhead"><b>${em} ${title}</b></div>
      ${items.map(i=>`<div class="food ${i.done?'done':''}">

        <span class="t grow" style="${i.done?'text-decoration:line-through':''}">${esc(i.name)}</span>
        <button class="del" data-act="fdel" data-id="${i.id}">✕</button></div>`).join('')}

  });

  return html;
}
function foodForm(code, items){
  const have = new Set(items.map(i=>i.name.toLowerCase()));

/* --- статистика --- */
function calcStreak(){
  let n = 0, d = today();
  const ok = x => S.days[x] && S.days[x].tasks.length && S.days[x].tasks.every(t=>t.done);
  if (!ok(d)) d = addDays(d,-1);
  while (ok(d)) { n++; d = addDays(d,-1); }
  return n;
}
function rStat(){
  const t = today(), days = [...Array(7)].map((_,i)=>addDays(t,i-6));
  const streak = calcStreak();
  const month = t.slice(0,7), wMonth = Object.keys(S.workouts).filter(d=>d.startsWith(month) && S.workouts[d].done);
  const tonM = wMonth.reduce((a,d)=>a+tonnage(S.workouts[d]),0);
  let html = `<div class="big3">
    <div class="card"><b>🔥 ${streak}</b><span class="muted small">${plural(streak,'день','дня','дней')} подряд</span></div>
    <div class="card sec-train"><b>${wMonth.length}</b><span class="muted small">трениров. в месяце</span></div>
    <div class="card sec-train"><b>${tonM>=1000?(tonM/1000).toFixed(1)+'т':r0(tonM)}</b><span class="muted small">поднято за месяц</span></div></div>`;
  html += progressCards();
  const dd = d => { const x = S.days[d]; return x && x.tasks.length ? x.tasks.filter(y=>y.done).length/x.tasks.length : 0; };
  html += `<div class="card sec-day"><h3>Задачи за неделю, % выполнения</h3><div class="bars">${days.map(d=>`<div><i style="height:${dd(d)*100}%"></i><span>${WD[new Date(d+'T12:00').getDay()]}</span></div>`).join('')}</div></div>`;
  const wl = days.map(d=>(getDay(d).waterMl||0)), wmx = Math.max(S.settings.waterL*1000*1.2, ...wl);
  html += `<div class="card sec-stat"><h3>💧 Вода за неделю, л <span class="muted small" style="margin-left:auto">цель ${fmtL(S.settings.waterL*1000)}</span></h3>
    <div class="bars">${days.map((d,i)=>`<div><i style="height:${wl[i]/wmx*100}%"></i><span>${wl[i]?fmtL(wl[i]):'·'}</span></div>`).join('')}</div>
    <div class="muted small" style="margin-top:6px;display:flex;justify-content:space-between">${days.map(d=>`<span>${WD[new Date(d+'T12:00').getDay()]}</span>`).join('')}</div></div>`;
  const moods = [...Array(14)].map((_,i)=>addDays(t,i-13)).map(d=>S.days[d]&&S.days[d].mood!=null ? MOODS[S.days[d].mood] : '·');
  html += `<div class="card"><h3>Настроение, 2 недели</h3><div style="display:flex;justify-content:space-between;font-size:20px">${moods.map(m=>`<span class="${m==='·'?'muted':''}">${m}</span>`).join('')}</div></div>`;
  // прогресс в упражнении
  const exNames = [...new Set(Object.values(S.workouts).flatMap(w=>w.exercises.filter(e=>e.sets.some(s=>num(s.w)>0)).map(e=>e.name)))];
  html += `<div class="card sec-train"><h3>📈 Прогресс в весах</h3>`;
  if (!exNames.length) html += `<div class="empty">Запиши вес хотя бы в одной тренировке — здесь появится график</div>`;
  else {
    if (!exNames.includes(V.statEx)) V.statEx = exNames[0];
    html += `<select data-field="statEx">${exNames.map(n=>`<option ${n===V.statEx?'selected':''}>${esc(n)}</option>`).join('')}</select>`;
    const pts = Object.keys(S.workouts).sort().filter(d => S.workouts[d].done || d < today()).map(d=>{ const e = S.workouts[d].exercises.find(x=>x.name===V.statEx);
      const m = e ? Math.max(0,...e.sets.map(s=>num(s.w))) : 0; return m ? [d,m] : null; }).filter(Boolean);
    html += lineChart(pts);
  }
  return html + '</div>';
}
function lineChart(pts){
  if (pts.length < 2) return `<div class="muted small" style="margin-top:10px">Лучший вес: <b>${pts[0]?pts[0][1]:0} кг</b>. Нужна ещё хотя бы одна тренировка для графика.</div>`;
  const W=320,H=140,P=24, vs=pts.map(p=>p[1]), lo=Math.min(...vs), hi=Math.max(...vs), span=hi-lo||1;
  const xy = pts.map((p,i)=>[P+i*(W-2*P)/(pts.length-1), H-P-(p[1]-lo)/span*(H-2*P)]);
  const first = vs[0], last = vs[vs.length-1], diff = last-first;
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;margin-top:10px">
    <polyline points="${xy.map(p=>p.join(',')).join(' ')}" fill="none" stroke="var(--train)" stroke-width="2.5" stroke-linejoin="round"/>
    ${xy.map((p,i)=>`<circle cx="${p[0]}" cy="${p[1]}" r="4" fill="var(--train)"/><text x="${p[0]}" y="${p[1]-9}" font-size="11" text-anchor="middle" fill="var(--text)">${vs[i]}</text>`).join('')}
    <text x="${P}" y="${H-4}" font-size="10" fill="var(--muted)">${fmt(pts[0][0])}</text>
    <text x="${W-P}" y="${H-4}" font-size="10" fill="var(--muted)" text-anchor="end">${fmt(pts[pts.length-1][0])}</text></svg>
    <div class="small" style="margin-top:4px">${diff>0?`🚀 +${+diff.toFixed(1)} кг с первой записи`:diff<0?`${+diff.toFixed(1)} кг с первой записи`:'Вес стабилен'}</div>`;
}

/* --- прогресс по упражнениям --- */
function exProgress(){
  const byName = {};
  Object.keys(S.workouts).sort().filter(d => S.workouts[d].done || d < today()).forEach(d => S.workouts[d].exercises.forEach(e => {
    const best = Math.max(0, ...e.sets.map(s=>num(s.w)));
    const vol = e.sets.reduce((a,s)=>a+num(s.w)*num(s.r),0);
    const reps = Math.max(0, ...e.sets.filter(s=>num(s.w)===best).map(s=>num(s.r)));
    if (best || vol) (byName[e.name] ||= []).push({d, best, vol, reps});
  }));
  return Object.entries(byName).filter(([,a])=>a.length>=2).map(([name,a]) => {
    const f = a[0], l = a[a.length-1], p = a[a.length-2];
    return {name, n:a.length, first:f, last:l, diff:l.best-f.best, recent:l.best-p.best, volDiff:f.vol?Math.round((l.vol/f.vol-1)*100):0};
  }).sort((x,y)=>y.diff-x.diff || y.volDiff-x.volDiff);
}
function weekTon(offset){
  const t = today(); let sum = 0;
  for (let i=0;i<7;i++){ const d = addDays(t, -i-offset*7); if (S.workouts[d]) sum += tonnage(S.workouts[d]); }
  return sum;
}
function progressCards(){
  const pr = exProgress(), up = pr.filter(x=>x.diff>0), flat = pr.filter(x=>x.diff===0), down = pr.filter(x=>x.diff<0);
  const tw = weekTon(0), lw = weekTon(1);
  let h = `<div class="card sec-train"><h3>🏋️ Эта неделя против прошлой</h3>
    <div class="sum3"><div><b>${r0(tw)}</b><span class="muted small">кг сейчас</span></div><div><b>${r0(lw)}</b><span class="muted small">кг неделю назад</span></div>
    <div><b class="${tw>=lw?'up':'down'}">${lw?(tw>=lw?'+':'')+Math.round((tw/lw-1)*100)+'%':'—'}</b><span class="muted small">разница</span></div></div></div>`;
  if (!pr.length) return h + `<div class="card sec-train"><h3>📈 Где ты прогрессируешь</h3><div class="empty">Нужно хотя бы две тренировки с одним упражнением и записанным весом — тогда здесь будет видно, где ты стал поднимать больше</div></div>`;
  const row = x => `<button class="prog" style="width:100%;text-align:left" data-act="statpick" data-n="${esc(x.name)}"><span class="grow"><b>${esc(x.name)}</b><br>
    <span class="muted small">${x.first.best} → ${x.last.best} кг · ${x.n} ${plural(x.n,'тренировка','тренировки','тренировок')}${x.recent>0?' · в прошлый раз +'+(+x.recent.toFixed(1)):''}</span></span>
    <span class="delta ${x.diff>0?'up':x.diff<0?'down':'muted'}">${x.diff>0?'+':''}${+x.diff.toFixed(1)} кг</span></button>`;
  h += `<div class="card sec-train"><h3>📈 Где ты прогрессируешь</h3>
    ${up.length ? `<div class="small" style="margin-bottom:4px">🚀 Стал поднимать больше: <b>${up.length}</b> из ${pr.length}${up[0]?` · лучше всего — «${esc(up[0].name)}»`:''}</div>${up.map(row).join('')}` : '<div class="muted small">Пока без роста в весе — попробуй добавить 1–2,5 кг в следующий раз</div>'}
    ${flat.length ? `<div class="lab" style="margin-top:10px">➖ Держишь вес</div>${flat.map(row).join('')}`:''}
    ${down.length ? `<div class="lab" style="margin-top:10px">📉 Просело</div>${down.map(row).join('')}`:''}</div>`;
  return h;
}

/* ---------- таймер отдыха ---------- */
let T = {end:0, iv:null};
function startTimer(sec){
  T.end = Date.now()+sec*1000; clearInterval(T.iv);
  T.iv = setInterval(()=>{ if (Date.now() >= T.end) { clearInterval(T.iv); T.end = 0; beep(); toast('Отдых окончен — следующий подход! 💪'); } renderTimer(); }, 250);
  renderTimer();
}
function renderTimer(){
  const el = $('#timer');
  if (screen()!=='train') { el.innerHTML=''; return; }
  if (T.end) { const left = Math.max(0, Math.ceil((T.end-Date.now())/1000));
    el.innerHTML = `<div class="timer"><span>⏱ ${Math.floor(left/60)}:${String(left%60).padStart(2,'0')}</span>
      <button style="color:#fff" data-act="tplus">+30</button><button style="color:#fff" data-act="tstop">✕</button></div>`; }
  else el.innerHTML = `<button class="timer idle" data-act="tstart" aria-label="Таймер отдыха">⏱ ${S.settings.rest}с</button>`;
}
function beep(){
  try { navigator.vibrate && navigator.vibrate([200,100,200]);
    const a = new (window.AudioContext||window.webkitAudioContext)(), o = a.createOscillator(), g = a.createGain();
    o.connect(g); g.connect(a.destination); o.frequency.value = 880; g.gain.value = .15; o.start(); o.stop(a.currentTime+.35); } catch(e){}
}

  wdel(){ if (confirm('Удалить тренировку за этот день?')) delete S.workouts[V.train]; },
  neq(el){ V.newEquip = V.newEquip===el.dataset.q ? '' : el.dataset.q; },
  excat(el){ const c = catFind(el.dataset.n); curW().exercises.push(newExercise(c.name, c.equip, V.train));
    const k = c.name.toLowerCase(); S.exLib[k] = {name:c.name, equip:c.equip, group:c.group, count:(S.exLib[k]?S.exLib[k].count:0)+1}; },
  exquick(el){ const x = S.exLib[el.dataset.k]; curW().exercises.push(newExercise(x.name, x.equip, V.train)); x.count++; },
  exdel(el){ const w = curW(); w.exercises = w.exercises.filter(e=>e.id!==el.dataset.id); },
  exup(el){ const a = curW().exercises, i = a.findIndex(e=>e.id===el.dataset.id); [a[i-1],a[i]] = [a[i],a[i-1]]; },
  sadd(el){ const e = findEx(el.dataset.id), l = e.sets[e.sets.length-1]; e.sets.push({w:l?l.w:'', r:l?l.r:'', done:false}); },
  srem(el){ findEx(el.dataset.id).sets.pop(); },
  sdone(el){ const e = findEx(el.dataset.id), i = +el.dataset.i, s = e.sets[i];
    if (!s.done) { // пустое поле — берём подсказку из прошлого раза
      const pw = placeholder(e,i,V.train,'w'), pr = placeholder(e,i,V.train,'r');
      if (s.w==='' && pw!=='кг') s.w = pw; if (s.r==='' && pr!=='раз') s.r = pr; }
    s.done = !s.done;
    if (s.done && S.settings.autoRest && !curW().done) startTimer(S.settings.rest); },
  tstart(){ startTimer(S.settings.rest); return false; },
  tplus(){ T.end += 30000; renderTimer(); return false; },
  tstop(){ clearInterval(T.iv); T.end = 0; renderTimer(); return false; },

  fopen(el){ V.foodMeal = el.dataset.m; V.focus = '#foodIn'; },
  fclose(){ V.foodMeal = null; },
  fquick(el){ addFood(el.dataset.m, S.foodLib[el.dataset.k].name); V.focus = '#foodIn'; },
  fdone(el){ const i = findFood(el.dataset.id); i.done = !i.done; },
  fdel(el){ const m = getMeals(V.food); m.items = m.items.filter(i=>i.id!==el.dataset.id); },
  fcopy(el){ getMeals(V.food, true).items = S.meals[el.dataset.d].items.map(i=>({...i, id:uid(), done:false})); },

  calpick(el){ V.calDay = el.dataset.d; },
  calm(el){ const [y,m] = V.cal.split('-').map(Number), d = new Date(y, m-1+ +el.dataset.n, 1); V.cal = ds(d).slice(0,7); },
  calopen(el){ V[el.dataset.s] = el.dataset.d; location.hash = el.dataset.s; return false; },
  statpick(el){ V.statEx = el.dataset.n; setTimeout(()=>$('select[data-field=statEx]')?.scrollIntoView({behavior:'smooth',block:'center'}),50); },
  rest(el){ S.settings.rest = +el.dataset.v; },
  export(){ const b = new Blob([JSON.stringify(S,null,1)], {type:'application/json'}), a = document.createElement('a');
    a.href = URL.createObjectURL(b); a.download = `moy-den-${today()}.json`; a.click(); return false; },
  reset(){ if (confirm('Точно стереть всё? Это нельзя отменить.')) { S = fresh(); toast('Данные стёрты'); } },
};
function addFood(meal, name){
  getMeals(V.food, true).items.push({id:uid(), meal, name, done:false});
  const k = name.toLowerCase(), e = S.foodLib[k] || {name, count:0}; e.count++; S.foodLib[k] = e;
}

document.addEventListener('click', e => {
  const go = e.target.closest('[data-go]');
  if (go) { location.hash = go.dataset.go; return; }
  const el = e.target.closest('[data-act]');
  if (!el || !ACT[el.dataset.act]) return;
  e.preventDefault();
  if (ACT[el.dataset.act](el, e) === false) { save(); return; }
  save(); render();
});
document.addEventListener('submit', e => {
  e.preventDefault();
  const f = e.target, fd = Object.fromEntries(new FormData(f));
  if (f.dataset.form === 'task') {
    const text = fd.text.trim(); if (!text) return;
    getDay(V.day, true).tasks.push({id:uid(), text, time:fd.time||'', done:false}); libTouch(text, V.day, fd.time);
    V.focus = '#taskIn';
  }
  if (f.dataset.form === 'tedit') {
    const t = findTask(f.dataset.id), text = fd.text.trim(); if (!t || !text) return;
    const ok = t.text.toLowerCase(), nk = text.toLowerCase(), old = S.taskLib[ok];
    t.text = text; t.time = fd.time || '';
    if (old && ok !== nk) { delete S.taskLib[ok]; S.taskLib[nk] = Object.assign(old, {text}); }
    if (S.taskLib[nk]) { S.taskLib[nk].text = text; if (S.taskLib[nk].daily) S.taskLib[nk].time = t.time; }
    V.edit = null;
  }
  if (f.dataset.form === 'ex') {
    const name = fd.name.trim(); if (!name) return;
    const k = name.toLowerCase(), lib = S.exLib[k];
    const equip = V.newEquip || (lib && lib.equip) || '';
    curW().exercises.push(newExercise(name, equip, V.train));
    S.exLib[k] = {name, equip, group: (lib&&lib.group) || (curW().groups.length===1 ? curW().groups[0] : ''), count:(lib?lib.count:0)+1};
    V.newEquip = ''; V.focus = '#exIn';
  }
  if (f.dataset.form === 'food') {
    const name = fd.name.trim(); if (!name) return;
    addFood(f.dataset.m, name); V.focus = '#foodIn';
  }
  save(); render();
});
// поля, которые меняют данные без перерисовки (чтобы не терять фокус)
document.addEventListener('input', e => {
  const el = e.target, f = el.dataset.field; if (!f) return;
  if (f==='sw' || f==='sr') { findEx(el.dataset.id).sets[+el.dataset.i][f==='sw'?'w':'r'] = el.value.trim().replace(',','.'); save(); }
  else if (f==='wtitle') { curW().title = el.value; save(); }
  else if (f==='name') { S.settings.name = el.value.trim(); save(); }
  else if (f==='waterGoal') { S.settings.waterL = Math.max(0.5, Math.min(10, num(el.value)||2)); save(); }
});
document.addEventListener('change', e => {
  const el = e.target, f = el.dataset.field;
  if (f==='statEx') { V.statEx = el.value; render(); }
  if (f==='autoRest') { S.settings.autoRest = el.checked; save(); }
  if (f==='import' && el.files[0]) { el.files[0].text().then(t => { try { const d = JSON.parse(t);
      if (!d.days || !d.settings) throw 0; S = Object.assign(fresh(), d); save(); toast('Данные загружены'); render(); }
    catch(_) { toast('Это не файл «Моего дня»'); } }); }
});
/* ---------- перетаскивание задач: удержать и потянуть ---------- */
let DRAGGED = false, DR = null;
function dragStart(row, y0){
  const list = row.parentElement, rows = [...list.querySelectorAll('.task[data-tid]')];
  DR = {row, list, rows, from: rows.indexOf(row), to: rows.indexOf(row), h: row.offsetHeight, y0, s0: scrollY, y: y0, iv: null};
  list.classList.add('dragging'); row.classList.add('drag');
  try { navigator.vibrate && navigator.vibrate(15); } catch(_){}
  DR.iv = setInterval(() => { if (!DR) return;
    const m = 90, vh = innerHeight; if (DR.y < m) scrollBy(0, -14); else if (DR.y > vh - m - 70) scrollBy(0, 14); dragUpdate(); }, 16);
}
function dragUpdate(){
  const d = DR; if (!d) return;
  const dy = (d.y + scrollY) - (d.y0 + d.s0);
  d.row.style.transform = `translateY(${dy}px)`;
  const n = d.rows.length, to = Math.max(0, Math.min(n-1, d.from + Math.round(dy / d.h)));
  d.to = to;
  d.rows.forEach((r, i) => { if (r === d.row) return;
    r.style.transform = (d.from < i && i <= to) ? `translateY(${-d.h}px)` : (to <= i && i < d.from) ? `translateY(${d.h}px)` : ''; });
}
function dragEnd(){
  const d = DR; if (!d) return; DR = null; clearInterval(d.iv);
  const day = getDay(V.day); const [t] = day.tasks.splice(d.from, 1); day.tasks.splice(d.to, 0, t);
  DRAGGED = true; setTimeout(() => DRAGGED = false, 400);
  save(); render();
}
let HOLD = null;
document.addEventListener('pointerdown', e => {
  const row = e.target.closest('.task[data-tid]');
  if (!row || e.target.closest('button,input,a') || screen() !== 'day' || e.button > 0) return;
  const x = e.clientX, y = e.clientY;
  clearTimeout(HOLD && HOLD.t);
  HOLD = {x, y, id: e.pointerId, t: setTimeout(() => { if (HOLD) { HOLD.on = true; dragStart(row, HOLD.y); } }, 380)};
});
document.addEventListener('pointermove', e => {
  if (!HOLD || e.pointerId !== HOLD.id) return;
  if (DR) { DR.y = e.clientY; dragUpdate(); return; }
  if (Math.hypot(e.clientX-HOLD.x, e.clientY-HOLD.y) > 8) { clearTimeout(HOLD.t); HOLD = null; }
});
const endHold = e => { if (!HOLD) return; clearTimeout(HOLD.t); const was = HOLD.on; HOLD = null;
  if (was && DR) { if (e.type==='pointercancel' && !DR) return; dragEnd(); } };
document.addEventListener('pointerup', endHold);
document.addEventListener('pointercancel', endHold);
document.addEventListener('touchmove', e => { if (DR) e.preventDefault(); }, {passive:false});
document.addEventListener('contextmenu', e => { if (e.target.closest('.task')) e.preventDefault(); });
window.addEventListener('hashchange', () => { scrollTo(0,0); render(); });
render();
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js');
</script>
